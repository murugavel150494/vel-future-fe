<div class="login-wrapper">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="logo-icon">⚡</div>
      <h2>VEL Studio</h2>
    </div>

    @if (errorMessage()) {
      <div class="elite-alert error">
        <span>⚠️</span> {{ errorMessage() }}
      </div>
    }

    <form (submit)="onLogin($event)" class="login-form">
      <div class="form-group">
        <label for="username">Admin Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            id="username"
            type="text" 
            class="elite-input" 
            placeholder="Enter username" 
            [value]="username()" 
            (input)="updateUsername($event)"
            [disabled]="isLoading()" 
            required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            id="password"
            type="password" 
            class="elite-input" 
            placeholder="••••••••••••" 
            [value]="password()" 
            (input)="updatePassword($event)"
            [disabled]="isLoading()" 
            required />
        </div>
      </div>

      <button 
        type="submit" 
        class="btn-elite" 
        [disabled]="isLoading()">
        @if (!isLoading()) {
          <span>Access VEL Studio →</span>
        } @else {
          <span class="spinner"></span>
          <span>Authenticating Future...</span>
        }
      </button>
    </form>

    <div class="login-footer">
      <p>VEL Future • Automated Pipeline Engine © 2026</p>
    </div>
  </div>
</div>
